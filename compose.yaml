services:
  mongo:
    image: mongo:8.0.32
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - certificates_mongo:/data/db
    healthcheck:
      test:
        ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  certificates_mongo:
